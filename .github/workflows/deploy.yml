name: Test and deploy to GitHub Pages

# One Pages site, two builds:
#   /              -> main (the prototype)
#   /calibration/  -> the calibration branch (requirement change from exam question 2), if it exists
# Only main may deploy to Pages, so a push to the calibration branch triggers this
# workflow on main (see calibration-trigger.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build the calibration branch into /calibration/
        run: |
          if git ls-remote --exit-code --heads origin calibration > /dev/null; then
            git fetch --depth 1 origin calibration
            git worktree add ../calibration FETCH_HEAD
            (cd ../calibration && npm ci && npm test && npm run build)
            cp -r ../calibration/dist dist/calibration
            echo "Calibration build added at /calibration/"
          else
            echo "No calibration branch yet; skipping."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
