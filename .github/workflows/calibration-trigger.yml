name: Rebuild Pages after a calibration push

# Pages deploys only from main. When the calibration branch changes, ask the
# main workflow to rebuild the site (which includes /calibration/).
on:
  push:
    branches: [calibration]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
